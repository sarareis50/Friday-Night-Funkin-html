name: Auto Update FNF HTML5 Build

on:
  workflow_dispatch: # Apenas corre quando o acionas manualmente

jobs:
  update-html5:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Fazer checkout do repositório
      - uses: actions/checkout@v3

      # 2️⃣ Obter o URL da última release via GitHub API
      - name: Get latest HTML5 release URL
        id: get_url
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/FunkinCrew/Funkin/releases/latest \
            | jq -r '.assets[] | select(.name=="funkin-html5.zip") | .browser_download_url')
          echo "LATEST_URL=$LATEST_URL" >> $GITHUB_ENV

      # 3️⃣ Descarregar o zip mais recente
      - name: Download latest HTML5 build
        run: |
          curl -L $LATEST_URL -o fnf_latest.zip

      # 4️⃣ Extrair DIRETAMENTE PARA A RAIZ (.) em vez de criar pasta
      - name: Extract HTML5 build to root
        run: |
          unzip -o fnf_latest.zip -d .
          rm fnf_latest.zip

      # 5️⃣ Guardar alterações e enviar para o GitHub
      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto-update HTML5 build to root" && git push)
